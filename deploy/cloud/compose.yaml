name: pdd-xianyu-cloud

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5678:5678"
    mem_limit: 1024m
    cpus: 1.5
    environment:
      TZ: Asia/Shanghai
      GENERIC_TIMEZONE: Asia/Shanghai
      DB_TYPE: sqlite
      N8N_HOST: localhost
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:15678/
      N8N_WEBHOOK_URL: http://localhost:15678/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set the server-side encryption key}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      N8N_RUNNERS_MAX_CONCURRENCY: "1"
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: "256"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ./data:/home/node/.n8n
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz/readiness', r => {r.resume(); process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
